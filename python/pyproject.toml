[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-tiktok"
version = "0.1.3"
description = "Crawlora TikTok API client with 25 endpoints for video, user, and hashtag search; profiles and posts; comments; trends; Creative Center; and Top Ads data"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "tiktok", "tiktok-api", "tiktok-scraper", "tiktok-data", "tiktok-video", "tiktok-user", "tiktok-hashtag-search", "tiktok-profiles-posts", "tiktok-comments", "tiktok-trends", "tiktok-creative-center", "tiktok-top-ads-data"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=tiktok-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=tiktok-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-tiktok"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_tiktok"]

[tool.setuptools.package-data]
"crawlora_tiktok" = ["py.typed", "*.pyi"]
